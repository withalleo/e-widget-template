<!--
  WIDGET SUMMARY
  ==============

  Outgoing actions (triggered via alleo.triggerAction):
    - onloaded ()                         fired once after init
    - demo (demo-param: string)           fired when "Trigger action" is clicked

  Incoming actions (handled via alleo.onIncomingAction):
    - <any> (data?: Record<string, unknown>)   every incoming action is logged

  Synced status:
    - Reads the full status via alleo.onSyncedStatusUpdate
    - Requests it via alleo.requestSyncedStatus (does not write)

  ⚠ WARNING: Requires "Enable Alleo board features for enclosed content"
             (and "Enable synchronizing status" for the status request).
-->
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EmbedWidgetMessenger - Basic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 16px;
        }

        button {
            padding: 8px 12px;
        }

        pre {
            background: #f4f4f4;
            padding: 8px;
        }
    </style>
</head>
<body>
<EWidgetSDK/>
<h1>EmbedWidgetMessenger - Basic</h1>
<p>This page is intended to run inside the E-widget iframe.</p>

<button id="trigger">Trigger action</button>
<button id="request">Request synced status</button>

<h2>Log</h2>
<pre id="log"></pre>

<script>
    const logEl = document.getElementById('log')
    const log = (message, data) => {
        const line = data ? `${message} ${JSON.stringify(data)}` : message
        logEl.textContent = `${line}\n${logEl.textContent}`
    }

    alleo.onSyncedStatusUpdate((status) => {
        log('syncedStatusUpdate:', status)
    })

    alleo.onIncomingAction(({actionId, data}) => {
        log(`incomingAction: ${actionId}`, data)
    })

    document.getElementById('trigger').addEventListener('click', () => {
        alleo.triggerAction('demo', {
            'demo-param': 'Hello from iframe',
        })
        log('triggerAction sent')
    })

    document.getElementById('request').addEventListener('click', () => {
        alleo.requestSyncedStatus()
        log('requestSyncedStatus sent')
    })

    // Pull any existing shared state, then announce the widget is ready.
    alleo.requestSyncedStatus()
    alleo.triggerAction('onloaded')
    log('onloaded sent')
</script>
</body>
</html>
