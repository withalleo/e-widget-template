<!--
  WIDGET SUMMARY
  ==============

  Outgoing actions (triggered via alleo.triggerAction):
    - onloaded ()   fired once after init

  Incoming actions (handled via alleo.onIncomingAction):
    - none

  Microphone (via alleo.mic):
    - start({ timeslice }) / stop()
    - onTrack registered BEFORE start(); onStarted / onStopped / onError handled

  ⚠ WARNING: This widget requests microphone access via alleo.mic. The user must
             enable "Allow content access to the microphone". The parent prompts
             for permission on the first alleo.mic.start() call. (Camera access is
             not available inside the iframe.)
-->
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EmbedWidgetMessenger - Microphone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 16px;
            max-width: 720px;
        }

        button {
            padding: 8px 12px;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        pre {
            background: #f4f4f4;
            padding: 8px;
            max-height: 220px;
            overflow: auto;
        }

        label {
            display: inline-block;
            margin-right: 12px;
        }

        input[type='number'] {
            width: 70px;
            padding: 4px 8px;
        }

        canvas {
            width: 100%;
            height: 80px;
            background: #111;
            border-radius: 4px;
            display: block;
            margin: 12px 0;
        }
    </style>
</head>
<body>
<EWidgetSDK/>
<h1>Microphone</h1>
<p>
    These commands require <strong>Enable microphone access</strong> in the widget settings.
    The parent will prompt the user for microphone permission the first time
    <code>alleo.mic.start()</code> is called.
</p>

<label>
    Chunk size (ms, max 200):
    <input id="timeslice" max="200" min="20" type="number" value="100"/>
</label>

<div>
    <button id="start">Start mic</button>
    <button disabled id="stop">Stop mic</button>
</div>

<h2>Live waveform</h2>
<canvas height="80" id="scope" width="720"></canvas>
<audio controls id="monitor"></audio>

<h2>Log</h2>
<pre id="log"></pre>

<script>
    const logEl = document.getElementById('log')
    const log = (message, data) => {
        const line = data !== undefined ? `${message} ${JSON.stringify(data)}` : message
        logEl.textContent = `${line}\n${logEl.textContent}`
    }

    const startBtn = document.getElementById('start')
    const stopBtn = document.getElementById('stop')
    const monitor = document.getElementById('monitor')
    const canvas = document.getElementById('scope')
    const ctx2d = canvas.getContext('2d')
    const timesliceInput = document.getElementById('timeslice')

    let analyserRaf = 0

    alleo.mic.onStarted((info) => {
        log('mic started', info)
        startBtn.disabled = true
        stopBtn.disabled = false
    })

    alleo.mic.onStopped(() => {
        log('mic stopped')
        startBtn.disabled = false
        stopBtn.disabled = true
        cancelAnimationFrame(analyserRaf)
        monitor.srcObject = null
    })

    alleo.mic.onError(({error}) => {
        log('mic error: ' + error)
        startBtn.disabled = false
        stopBtn.disabled = true
    })

    alleo.mic.onTrack((stream) => {
        log('Live mic stream received', {tracks: stream.getAudioTracks().length})

        // 1. Play it back through an <audio> element.
        monitor.srcObject = stream
        monitor.play().catch(() => {
        })

        // 2. Visualise it via Web Audio.
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)()
        const source = audioCtx.createMediaStreamSource(stream)
        const analyser = audioCtx.createAnalyser()
        analyser.fftSize = 1024
        source.connect(analyser)
        const buffer = new Uint8Array(analyser.fftSize)

        const draw = () => {
            analyserRaf = requestAnimationFrame(draw)
            analyser.getByteTimeDomainData(buffer)
            ctx2d.fillStyle = '#111'
            ctx2d.fillRect(0, 0, canvas.width, canvas.height)
            ctx2d.lineWidth = 2
            ctx2d.strokeStyle = '#2c8'
            ctx2d.beginPath()
            const slice = canvas.width / buffer.length
            for (let i = 0; i < buffer.length; i++) {
                const v = buffer[i] / 128.0
                const y = (v * canvas.height) / 2
                const x = i * slice
                if (i === 0) ctx2d.moveTo(x, y); else ctx2d.lineTo(x, y)
            }
            ctx2d.lineTo(canvas.width, canvas.height / 2)
            ctx2d.stroke()
        }
        draw()
    })

    startBtn.addEventListener('click', () => {
        const timeslice = Math.min(200, Math.max(20, Number(timesliceInput.value) || 100))
        alleo.mic.start({timeslice})
        log(`mic.start({ timeslice: ${timeslice} })`)
    })

    stopBtn.addEventListener('click', () => {
        alleo.mic.stop()
        log('mic.stop()')
    })

    // Mic handlers registered and listeners attached — announce readiness.
    alleo.triggerAction('onloaded')
</script>
</body>
</html>
